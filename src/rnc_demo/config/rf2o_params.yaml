# Node name must match the launch file. This is the file
# drawn_trajectory_simulation, simulation, and real_robot load.
# slam_params.yaml is not loaded by those launches.
rf2o_laser_odometry:
  ros__parameters:
    # Gazebo and the LDS publish /scan best-effort, which is the QoS this node uses.
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    # Burger root. The diff-drive plugin already broadcasts odom -> base_footprint.
    base_frame_id: base_footprint
    odom_frame_id: odom
    publish_tf: false
    # Empty: integrate from the origin. A non-empty value waits for that topic
    # and never publishes until a message arrives. This sim has no ground-truth topic.
    init_pose_from_topic: ""
    # Burger LDS update_rate is 5 Hz. A faster loop only warns between scans.
    freq: 5.0
